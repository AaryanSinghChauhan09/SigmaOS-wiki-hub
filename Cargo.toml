[package]
name = "sigmaos-wiki-hub"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "SigmaOS wiki hub — component documentation index and search"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.0", features = ["derive"] }
directories = "5.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "sigmaos-wiki-hub"
path = "src/main.rs"
